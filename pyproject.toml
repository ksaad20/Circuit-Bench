[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "circuitbench"
version = "1.0.0"
description = "A reference benchmarking and evaluation framework for AI-driven electrical circuit design."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

authors = [
    { name = "Asif Kazi" }
]

keywords = [
    "machine-learning",
    "benchmark",
    "artificial-intelligence",
    "deep-learning",
    "classification",
    "regression",
    "evaluation",
    "benchmarking",
    "statistics",
    "explainable-ai",
    "calibration",
    "research-software",
    "scientific-computing"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13",
    "typing_extensions>=4.4"
]


[project.optional-dependencies]

explainability = [
    "shap>=0.45"
]

development = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
    "flake8",
    "mypy",
    "pre-commit"
]

docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints"
]


[project.urls]

Homepage = "https://github.com/ksaad20/Circuit-Bench"
Repository = "https://github.com/ksaad20/Circuit-Bench"
Issues = "https://github.com/ksaad20/Circuit-Bench/issues"


[project.scripts]

circuitbench = "circuitbench.cli.main:main"


[tool.setuptools.packages.find]

where = ["src"]
include = ["circuitbench*"]


[tool.ruff]

line-length = 88
target-version = "py310"


[tool.ruff.lint]

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "BLE",
    "PLW",
    "RUF"
]

ignore = []


[tool.ruff.format]

quote-style = "double"
indent-style = "space"


[tool.flake8]

max-line-length = 88
extend-ignore = [
    "E203",
    "W503"
]


[tool.pytest.ini_options]

minversion = "8.0"
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
pythonpath = [
    "src"
]
addopts = "-ra"


[tool.mypy]

python_version = "3.10"
ignore_missing_imports = true
