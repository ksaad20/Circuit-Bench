# ruff.toml — zero loop, zero conflict config

target-version = "py311"
line-length = 88
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
# These rules are known to conflict with the formatter (fix loops):
ignore = [
    "E501",  # line-too-long (formatter handles it)
    "COM812",  # trailing comma — fights ruff format
    "COM819",  # trailing comma prohibited — fights ruff format
    "ISC001",  # implicit string concat — fights ruff format
    "W191",  # indentation contains tabs — formatter handles it
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["src"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88
