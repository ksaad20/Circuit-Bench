# ruff.toml — zero errors for ML-style Python

target-version = "py311"
line-length = 88
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-too-long (formatter handles it)
    "COM812", # trailing comma conflicts with formatter
    "COM819", # trailing comma conflicts with formatter
    "ISC001", # implicit string concat conflicts with formatter
    "N806",   # uppercase variable names (X, y in ML are standard)
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["src"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88
