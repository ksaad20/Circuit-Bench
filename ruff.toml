# ruff.toml — zero-error for ML/test codebases

target-version = "py311"
line-length = 88
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
# Dropped "N" (pep8-naming) entirely — too noisy for ML code (X, y, etc.)
ignore = [
    "E501",   # line-too-long (formatter handles it)
    "E741",   # ambiguous variable names (l, I, O) — common in math/ML code
    "E731",   # lambda assignment — common in data pipelines
    "E402",   # imports not at top — common in notebooks/conditional imports
    "F401",   # unused imports — often intentional in __init__.py
    "F841",   # unused variables — common in tests (unpack but don't use)
    "COM812", # trailing comma conflicts with formatter
    "COM819", # trailing comma conflicts with formatter
    "ISC001", # implicit string concat conflicts with formatter
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in package init files
"tests/**" = ["E741"]     # allow single-letter vars in tests

[lint.isort]
known-first-party = ["src"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88
